<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta
          name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>com.tbye.datetime Property Inspector</title>
    <link rel="stylesheet" href="../../../libs/css/sdpi.css" />
    <link rel="stylesheet" href="inspector.css" />
</head>

<body> 
    <div id="pi" class="sdpi-wrapper">
        <div id="piwrap" style="display:none;">
            <form id="property_inspector">
                <div class="sdpi-item">
                    <div class="sdpi-item-label">Segment(s)</div>
                    <select id="dtsegment" class="sdpi-item-value" name="dtsegment">
                        <optgroup label="Compound Options">
                            <option selected value="full">Date and Time</option>
                            <option value="date">Date</option>
                            <option value="date_no_year">Date (No Year)</option>
                            <option value="time">Time</option>
                            <option value="time_no_seconds">Time (No Seconds)</option>
                            <option value="time_no_seconds_ampm">Time (No Seconds, No AM / PM)</option>
                        </optgroup>
                        <optgroup label="Date Options">
                            <option value="day">Day</option>
                            <option value="day_ordinal">Date (Ordinal, e.g. 2nd, 3rd)</option>
                            <option value="day_name">Day Name (e.g. Monday)</option>
                            <option value="day_abbrev">Day Abbreviation (e.g. Mon)</option>
                            <option value="month">Month</option>
                            <option value="month_name">Month Name</option>
                            <option value="month_abbrev">Month Abbreviation</option>
                            <option value="year">Year</option>
                            <option value="week_iso">Week Number (ISO 8601)</option>
                        </optgroup>
                        <optgroup label="Time Options">
                            <option value="hours_12">Hour (12)</option>
                            <option value="hours_24">Hour (24)</option>
                            <option value="minute">Minutes</option>
                            <option value="second">Seconds</option>
                            <option value="ampm">AM / PM</option>
                        </optgroup>
                    </select>
                </div>
                <div class="sdpi-item">
                    <div class="sdpi-item-label">Date Format</div>
                    <select id="dateformat" class="sdpi-item-value" name="dateformat">
                        <option selected value="locale">System Default</option>
                        <option value="mm_dd_yyyy">MM/DD/YYYY</option>
                        <option value="dd_mm_yyyy">DD/MM/YYYY</option>
                        <option value="yyyy_mm_dd">YYYY-MM-DD</option>
                        <option value="d_m_yyyy_dot">D.M.YYYY (e.g. 27.3.2026)</option>
                        <option value="dd_mm_yyyy_dot">DD.MM.YYYY (e.g. 27.03.2026)</option>
                    </select>
                </div>
                <div class="sdpi-item">
                    <div class="sdpi-item-label">Hour Format</div>
                    <select id="hourformat" class="sdpi-item-value" name="hourformat">
                        <option selected value="locale">System Default</option>
                        <option value="12">12-Hour</option>
                        <option value="24">24-Hour</option>
                    </select>
                </div>
                <div class="sdpi-item">
                    <div class="sdpi-item-label">Language</div>
                    <select id="language" class="sdpi-item-value" name="language">
                        <option selected value="locale">System Default</option>
                        <option value="en">English</option>
                        <option value="tr">Türkçe (Turkish)</option>
                        <option value="de">Deutsch (German)</option>
                        <option value="pl">Polski (Polish)</option>
                        <option value="fr">Français (French)</option>
                        <option value="es">Español (Spanish)</option>
                        <option value="pt">Português (Portuguese)</option>
                        <option value="it">Italiano (Italian)</option>
                        <option value="nl">Nederlands (Dutch)</option>
                        <option value="ja">日本語 (Japanese)</option>
                        <option value="zh-CN">中文 (Chinese Simplified)</option>
                        <option value="ko">한국어 (Korean)</option>
                    </select>
                </div>
            </form>
        </div>
    <div class="sdpi-info-label hidden" style="top: -1000" value=""></div>

    <!-- Stream Deck Libs -->
    <script src="../../../libs/js/constants.js"></script>
    <script src="../../../libs/js/prototypes.js"></script>
    <script src="../../../libs/js/timers.js"></script>
    <script src="../../../libs/js/utils.js"></script>
    <script src="../../../libs/js/events.js"></script>
    <script src="../../../libs/js/api.js"></script>
    <script src="../../../libs/js/property-inspector.js"></script>
    <script src="../../../libs/js/dynamic-styles.js"></script>

    <!-- Property Inspector Source -->
    <script src="inspector.js"></script>
</body>

</html>
